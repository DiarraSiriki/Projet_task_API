info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/auth/sign-up/email"
  auth: inherit
  body:
    mimeType: application/json
    text: |-
      {
        "email": "test@example.com",
        "password": "password123",
        "name": "Test User"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
